<style>
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jakarta-400.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/jakarta-500.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/jakarta-600.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/jakarta-700.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/jakarta-800.woff2) format("woff2")}
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8EDE9; --line:#DAE2DC;
  --text:#15201A; --muted:#5E6D66; --sage:#3E7D5C; --sage-soft:#D6E8DC;
  --hero-a:#4F8A69; --hero-b:#2F6249; --on-hero:#FFFFFF;
  --gold:#C9962E; --red:#C4544A; --blue:#3C7DAA; --shadow:0 10px 30px rgba(30,60,45,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1012; --surface:#161A1D; --surface-2:#21272B; --line:#2A3236;
    --text:#ECEFEC; --muted:#8C9994; --sage:#80B094; --sage-soft:#22352B;
    --hero-a:#6E9F82; --hero-b:#46705A; --on-hero:#FFFFFF;
    --gold:#E4B95C; --red:#E27C70; --blue:#6FA6CB; --shadow:0 12px 34px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1012; --surface:#161A1D; --surface-2:#21272B; --line:#2A3236;
  --text:#ECEFEC; --muted:#8C9994; --sage:#80B094; --sage-soft:#22352B;
  --hero-a:#6E9F82; --hero-b:#46705A; --on-hero:#FFFFFF;
  --gold:#E4B95C; --red:#E27C70; --blue:#6FA6CB; --shadow:0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;padding:12px 16px 120px}
header.top{display:flex;align-items:center;gap:8px;padding:10px 2px 14px}
header.top h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0;flex:1}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.pill-select{height:42px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-weight:600}

/* months */
.months{display:flex;align-items:center;gap:4px;margin-bottom:16px;padding:4px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.months .arrow{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--muted)}
.months .arrow:not(:disabled):active{background:var(--surface-2)}
.months .arrow:disabled{opacity:.25;cursor:default}
.mlabel{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:14px;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mlabel .yr{color:var(--muted);font-weight:500}
.mlabel svg{width:14px;color:var(--muted);transform:rotate(90deg)}
.mlabel:active{background:var(--surface-2)}
.mnow{display:block;margin:-8px auto 14px;font-size:13px;font-weight:600;color:var(--sage);padding:4px 10px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mgrid button{position:relative;padding:14px 4px;border-radius:14px;background:var(--surface-2);font-weight:600}
.mgrid button.on{background:var(--sage);color:var(--on-hero)}
.mgrid button:disabled{opacity:.3;cursor:default}
.mgrid button i{position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--sage)}
.mgrid button.on i{background:var(--on-hero)}
.yearbar{display:flex;align-items:center;justify-content:space-between}
.yearbar b{font-size:19px}

/* hero */
.hero{border-radius:26px;padding:20px;background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:var(--on-hero);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{opacity:.85;font-size:14px;font-weight:500}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.035em;margin:2px 0 14px}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .cell{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px}
.hero .cell small{display:block;opacity:.85;font-size:12.5px}
.hero .cell b{font-size:17px}
.hero .eye{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;z-index:1}
.hero .eye svg{width:20px}

/* sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.card h2{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px 0}
.quick .ic{width:52px;height:52px;border-radius:17px;background:var(--surface-2);display:grid;place-items:center;font-size:24px}

/* list */
.day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 6px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface-2)}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;white-space:nowrap}
.pos{color:var(--sage)} .neg{color:var(--red)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .em{font-size:44px;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* fab + nav */
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(94px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--sage);color:var(--on-hero);display:grid;place-items:center;box-shadow:var(--shadow);z-index:20}
.fab svg{width:28px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 8px}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:16px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--sage);background:var(--sage-soft)}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* stats */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:16px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{font-size:17px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.legend div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend span.dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-wrap{overflow-x:auto}
svg text{font-family:inherit}

/* path */
.task{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.task .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.task.done .ck{background:var(--sage);border-color:var(--sage);color:#fff}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--sage)}

/* settings */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 2px;width:100%;text-align:left}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .ic{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.set-row .mid{flex:1}
.set-row .s{font-size:12.5px;color:var(--muted)}
.set-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 6px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:12px 14px;outline:none}
.inp:focus{border-color:var(--sage)}
.amount-inp{font-size:32px;font-weight:800;letter-spacing:-.03em;padding:10px 14px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{padding:10px 4px;border-radius:14px;background:var(--surface-2);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.cats button span{font-size:22px}
.cats button.on{border-color:var(--sage);background:var(--sage-soft)}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--sage);color:var(--on-hero);font-weight:700;font-size:16px;margin-top:20px}
.btn.ghost{background:transparent;color:var(--red);margin-top:8px}
.btn.sec{background:var(--surface-2);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;animation:fade .2s}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface-2)}
.tag.biz{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.calc{font-size:14px;color:var(--sage);font-weight:700;margin-top:6px}
.calc:empty{display:none}
.ops{display:flex;gap:6px;margin-top:8px}
.ops button{flex:1;padding:9px 0;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:16px}
.tpl{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -2px}
.tpl button{flex:none;padding:8px 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;white-space:nowrap}
.set-row.check{cursor:pointer;border-top:0;margin-top:8px;background:var(--surface-2);border-radius:16px;padding:10px 12px}
.set-row.check .ic{background:var(--surface)}
.set-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--sage);flex:none}
.prog i{border-radius:99px}
.prog.budget{position:relative;overflow:visible}
.prog.budget b{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;background:var(--muted);border-radius:2px;opacity:.7}
.brow{display:flex;align-items:center;gap:10px;padding:10px 0}
.brow+.brow{border-top:1px solid var(--line)}
.brow .mid{flex:1;min-width:0}
.brow .s{font-size:12px;color:var(--muted)}
.brow .bin{width:132px;flex:none}
.brow .inp{padding:10px 12px;text-align:right}
.goal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:12px 0}
.goal+.goal{border-top:1px solid var(--line)}
.goal-main{display:flex;gap:12px;align-items:center;text-align:left;min-width:0}
.goal .mid{display:flex;flex-direction:column;min-width:0}
.goal .t{font-weight:600}
.goal .s{font-size:12.5px;color:var(--muted)}
.goal .prog{grid-column:1/-1;margin:2px 0 0}
.gnum{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo button{aspect-ratio:1;border-radius:12px;background:var(--surface-2);font-size:20px;border:2px solid transparent}
.emo button.on{border-color:var(--sage);background:var(--sage-soft)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.colors button.on{border-color:var(--text)}
html,body{overscroll-behavior-y:none}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,nav,.day,.lbl,.hero{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.inp,.pill-select,select{font-size:16px}
.amount-inp{font-size:32px}
.btn,.quick .ic,.fab,nav.bottom button,.paybtn,.icon-btn,.item,.chip{transition:transform .12s ease}
.btn:active,.quick button:active .ic,.fab:active,nav.bottom button:active,.paybtn:active,.icon-btn:active{transform:scale(.95)}
.item:active{transform:scale(.985)}
#boot{position:fixed;inset:0;z-index:200;background:#0D1012;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s ease}
#boot img{width:28vmin;height:28vmin;border-radius:22.5%;margin-top:-16vh}
#boot b{color:#ECEFEC;font-size:5.6vmin;font-weight:800;letter-spacing:-.02em}
#boot.out{opacity:0;pointer-events:none}
.steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:15px}
.steps li+li{border-top:1px solid var(--line)}
.steps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sage);color:var(--on-hero);display:grid;place-items:center;font-weight:800;font-size:13px}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:8px;background:var(--surface-2);font-weight:700;white-space:nowrap}
.kbd svg{width:15px;height:15px}
/* ===== layout modeled on the reference screens ===== */
:root{--nav-ic:#A2ABB5;--nav-ic2:#C7CED5;--nav-cut:var(--surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nav-ic:#5F6977;--nav-ic2:#3E4650}}
:root[data-theme="dark"]{--nav-ic:#5F6977;--nav-ic2:#3E4650}
.app{padding:8px 18px 130px}
header.top{gap:8px;padding:12px 0 18px}
header.top h1{font-size:27px;flex:1;font-weight:800;letter-spacing:-.035em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top h1.h-sm{font-size:25px;font-weight:700;letter-spacing:-.02em}
header.top.center{display:grid;grid-template-columns:44px 1fr 44px;text-align:center}
header.top.center h1{font-size:27px}
.hsp{width:44px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:14px;border:1.5px solid var(--line);flex:none;color:var(--text)}
.icon-btn svg{width:21px;height:21px}
.icon-btn.fill{background:var(--surface-2);border-color:transparent}
.ping{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.wpill{position:relative;display:flex;align-items:center;gap:5px;height:42px;padding:0 10px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:16px;flex:none;max-width:130px}

const parseNum = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
// "12.000+8rb", "1,5jt", "3x15000" -> number; NaN when it is not a valid sum
function parseAmount(s) {
  let x = String(s || '').toLowerCase().replace(/rp/g, '').replace(/\s+/g, '');
  if (!x) return 0;
  x = x.replace(/(\d)[.,](?=\d{3}(\D|$))/g, '$1').replace(/(\d)[.,](?=\d{3}(\D|$))/g, '$1');
  x = x.replace(/,/g, '.').replace(/[x×]/g, '*').replace(/[:÷]/g, '/').replace(/−/g, '-');
  x = x.replace(/(\d+(?:\.\d+)?)(jt|juta)/g, '($1*1000000)').replace(/(\d+(?:\.\d+)?)(rb|ribu|k)/g, '($1*1000)');
  if (!/^[\d.+\-*/()]+$/.test(x)) return NaN;
  try { const v = Function('"use strict";return (' + x + ')')(); return Number.isFinite(v) ? Math.round(v) : NaN; } catch { return NaN; }
}
const amt0 = s => { const v = parseAmount(s); return Number.isNaN(v) || v < 0 ? 0 : v; };

function walletBalance(w) {
  let b = Number(w.initial) || 0;
  for (const t of S.tx) {
    if (t.type === 'income' && t.walletId === w.id) b += t.amount;
    if (t.type === 'expense' && t.walletId === w.id) b -= t.amount;
    if (t.type === 'adjust' && t.walletId === w.id) b += t.amount;
    if (t.type === 'transfer') { if (t.walletId === w.id) b -= t.amount; if (t.toWalletId === w.id) b += t.amount; }
  }
  return b;
}
const totalBalance = (wid = 'all') => S.wallets.filter(w => wid === 'all' || w.id === wid).reduce((a, w) => a + walletBalance(w), 0);
const txIn = (ym, wid = 'all') => S.tx.filter(t => ymOf(t.date) === ym && (wid === 'all' || t.walletId === wid || t.toWalletId === wid));
const sumType = (list, type) => list.filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);
const debtSum = kind => S.debts.filter(d => d.kind === kind && !d.paid).reduce((a, d) => a + d.amount, 0);
const assetSum = () => S.assets.reduce((a, x) => a + (Number(x.value) || 0), 0);
const netWorth = () => totalBalance() + assetSum() + debtSum('lent') - debtSum('borrowed');
function balanceOn(dayIso) { // total cash at end of a past day
  let b = totalBalance();
  for (const t of S.tx) if (t.date > dayIso) { if (t.type === 'income' || t.type === 'adjust') b -= t.amount; if (t.type === 'expense') b += t.amount; }
  return b;
}
function nextPayday() {
  const now = new Date(); now.setHours(0,0,0,0);
  const d = Math.min(28, Math.max(1, S.settings.payday || 1));
  let p = new Date(now.getFullYear(), now.getMonth(), d);
  if (p <= now) p = new Date(now.getFullYear(), now.getMonth() + 1, d);
  return {date:p, days:Math.max(1, Math.round((p - now) / 864e5))};
}
function dayLabel(iso) {
  const t = today(), y = new Date(); y.setDate(y.getDate()-1);
  if (iso === t) return 'Hari ini';
  if (iso === isoDay(y)) return 'Kemarin';
  const d = new Date(iso + 'T00:00');
  return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`;
}

const MONTHS_FULL = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function monthsList() {
  const cur = ymOf(today());
  const first = S.tx.reduce((m, t) => t.date < m ? t.date : m, today()).slice(0, 7);
  let start = shiftYm(cur, -5);
  if (first < start) start = first;
  if (ui.month < start) start = ui.month;
  const out = []; for (let m = start; m <= cur; m = shiftYm(m, 1)) out.push(m);
  return out;
}
function monthPicker() {
  return `<div class="mrow"><button class="calbtn" data-act="pickmonth" aria-label="Pilih bulan">${I.cal}${I.down}</button>
    <div class="mchips" id="mchips">${monthsList().map(m => `<button class="mchip ${m === ui.month ? 'on' : ''}" data-act="setmonth" data-m="${m}">${ymLabel(m)}</button>`).join('')}</div></div>`;
}
function monthSheet(year) {
  const cur = ymOf(today()), maxY = +cur.slice(0, 4);
  year = year || +ui.month.slice(0, 4);
  const has = new Set(S.tx.map(t => ymOf(t.date)));
  sheet(`<div class="yearbar"><button class="icon-btn" data-y="${year-1}" aria-label="Tahun sebelumnya">${I.l}</button><b class="num">${year}</b><button class="icon-btn" data-y="${year+1}" aria-label="Tahun berikutnya" ${year>=maxY?'disabled style="opacity:.25"':''}>${I.r}</button></div>
    <div class="mgrid">${MONTHS_FULL.map((n, i) => { const ym = `${year}-${pad(i+1)}`; return `<button class="${ym===ui.month?'on':''}" data-pm="${ym}" ${ym>cur?'disabled':''}>${n.slice(0, 3)}${has.has(ym)?'<i></i>':''}</button>`; }).join('')}</div>`, root => {
    root.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { if (!b.disabled) monthSheet(+b.dataset.y); });
    root.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { ui.month = b.dataset.pm; closeSheet(); render(); });
  });
}
function calendar() {
  const [y, m] = ui.month.split('-').map(Number);
  const first = new Date(y, m-1, 1).getDay(), n = new Date(y, m, 0).getDate();
  const byDay = {}; txIn(ui.month).filter(t => t.type==='expense').forEach(t => byDay[t.date] = (byDay[t.date]||0) + t.amount);
  const max = Math.max(1, ...Object.values(byDay));
  let cells = DAYS.map(d => `<div style="font-size:11px;color:var(--muted);text-align:center;font-weight:700">${d}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= n; d++) { const iso = `${ui.month}-${pad(d)}`, v = byDay[iso] || 0;
    cells += `<div style="aspect-ratio:1;border-radius:10px;background:${v ? `color-mix(in srgb, var(--red) ${20 + v/max*60}%, var(--surface-2))` : 'var(--surface-2)'};display:flex;flex-direction:column;align-items:center;justify-content:center;${iso===today()?'outline:2px solid var(--sage)':''}"><span style="font-size:12px;font-weight:700">${d}</span>${v?`<span style="font-size:9px" class="num">${S.settings.hide?'•':short(v)}</span>`:''}</div>`; }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${cells}</div>`;
}

const RANGES = [['7H', 7], ['1B', 30], ['3B', 90], ['YTD', 0], ['Semua', -1]];
function rangeDays() {
  const r = RANGES.find(x => x[0] === ui.range) || RANGES[1];
  if (r[1] > 0) return r[1];
  const now = new Date();
  if (r[1] === 0) return Math.max(2, Math.round((now - new Date(now.getFullYear(), 0, 1)) / 864e5) + 1);
  const first = S.tx.reduce((m, t) => t.date < m ? t.date : m, today());
  return Math.max(30, Math.round((now - new Date(first + 'T00:00')) / 864e5) + 1);
}
function rangeTabs() { return `<div class="ranges">${RANGES.map(([k]) => `<button class="${(ui.range || '1B') === k ? 'on' : ''}" data-act="range" data-k="${k}">${k}</button>`).join('')}</div>`; }
function series(kind) {
  const n = rangeDays(), out = [], d = new Date(); d.setDate(d.getDate() - (n - 1));
  const extra = assetSum() + debtSum('lent') - debtSum('borrowed');
  for (let i = 0; i < n; i++) { const iso = isoDay(d); out.push(kind === 'asset' ? assetSum() : balanceOn(iso) + (kind === 'net' ? extra : 0)); d.setDate(d.getDate() + 1); }

}
function areaChart(vals) {

  const n = vals.length, empty = vals.every(v => !v);
  const y = v => span ? 14 + (1 - (v - min) / span) * (H - 28) : (empty ? H / 2 : 14);
  const pts = vals.map((v, i) => [n > 1 ? i / (n - 1) * W : W, y(v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}"/><line y1="0" y2="${H}" x1="${W * f}" x2="${W * f}"/>`).join('');
  const s = new Date(), e = new Date(); s.setDate(s.getDate() - (n - 1));
  const fmt = d => `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== e.getFullYear() ? ' ' + d.getFullYear() : ''}`;
  return `<div class="achart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g class="grid">${grid}</g>
    ${empty ? `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>` : `<path d="${line} L${W} ${H} L0 ${H}Z" class="area"/><path d="${line}" fill="none" stroke="var(--sage)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`}</svg>

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

/* ---------- sheets ---------- */
function sheet(html, onMount) {

  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

}
const closeSheet = () => $('#layer').innerHTML = '';
function moneyInput(el) {
  el.setAttribute('inputmode', 'decimal'); el.setAttribute('autocomplete', 'off');
  const hint = document.createElement('div'); hint.className = 'calc'; el.after(hint);
  const plain = v => /^[\d.\s]*$/.test(v);
  el.addEventListener('input', () => {
    if (plain(el.value)) { const n = parseNum(el.value); el.value = /\d/.test(el.value) ? n.toLocaleString('id-ID') : ''; hint.textContent = ''; return; }
    const v = parseAmount(el.value); hint.textContent = Number.isNaN(v) ? '' : '= ' + rp(v);
  });
  el.addEventListener('blur', () => { if (!plain(el.value)) { const v = parseAmount(el.value); if (!Number.isNaN(v) && v >= 0) { el.value = v.toLocaleString('id-ID'); hint.textContent = ''; } } });
}
function opsRow(id) { return `<div class="ops" data-for="${id}">${['+','−','×','÷','000'].map(o => `<button type="button" data-op="${o}">${o}</button>`).join('')}</div>`; }
function wireOps(root) {
  root.querySelectorAll('.ops').forEach(row => {
    const el = root.querySelector('#' + row.dataset.for);
    row.querySelectorAll('[data-op]').forEach(b => {
      b.onpointerdown = e => e.preventDefault();
      b.onclick = () => { el.value = el.value.replace(/\s+$/, '') + b.dataset.op; el.focus(); el.dispatchEvent(new Event('input')); };
    });
  });
}

function frequentTx(type) {
  const m = new Map();
  S.tx.slice(-300).forEach(t => {
    if (t.type !== type) return;
    const k = [t.categoryId, (t.note || '').toLowerCase(), t.amount].join('|');
    const e = m.get(k) || {t, n:0}; e.n++; e.t = t; m.set(k, e);
  });
  return [...m.values()].filter(e => e.n >= 2).sort((a, b) => b.n - a.n || (b.t.created || 0) - (a.t.created || 0)).slice(0, 6).map(e => e.t);
}
const catSpent = (cid, ym, skipId) => S.tx.filter(x => x.type === 'expense' && x.categoryId === cid && ymOf(x.date) === ym && x.id !== skipId).reduce((a, x) => a + x.amount, 0);
function txSheet(existing, type = 'expense') {

      ${t.type==='transfer' ? `<div class="field"><label for="f-d">Tanggal</label><input id="f-d" type="date" class="inp" value="${t.date}"></div>` : ''}
      <div class="field"><label for="f-n">Catatan</label><input id="f-n" class="inp" placeholder="Misalnya: nasi padang" value="${esc(t.note)}" maxlength="80"></div>
      ${t.type !== 'transfer' ? `<label class="set-row check"><span class="ic">🏪</span><span class="mid"><b>Transaksi usaha</b><div class="s">Masuk laporan untung-rugi toko, terpisah dari uang pribadi</div></span><input id="f-biz" type="checkbox" ${t.biz?'checked':''}></label>` : ''}
      <button class="btn" id="f-save">${existing ? 'Simpan perubahan' : 'Simpan'}</button>

      root.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { grab(); t.type = b.dataset.type; draw(); });

      });
      root.querySelector('#f-save').onclick = () => {

        if (!t.amount) { amt.focus(); toast('Isi jumlahnya dulu'); return; }
        if (t.type === 'transfer' && t.walletId === t.toWalletId) { toast('Pilih dompet tujuan yang berbeda'); return; }
        const before = t.type === 'expense' ? catSpent(t.categoryId, ymOf(t.date), t.id) : 0, after = before + t.amount;

function billDue(b, ym) { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return `${ym}-${pad(Math.min(b.day, n))}`; }

const MM_EMOJI = {'Food & Drink':'🍜','Transport':'🛵','Groceries':'🛒','Bills & Fees':'🧾','Entertainment':'🎮','Family & Personal':'👨‍👩‍👧','Shopping':'🛍️','Healthcare':'💊','Home':'🏠','Car':'🚗','Education':'📚','Gifts':'🎁','Sport':'⚽','Other':'📦','Debt Payment':'💳','Salary':'💼','Extra Income':'💰','Investment':'📈'};

  st.wallets = d.wallets.map(w => ({id:w.id, name:w.name, type:/cash/i.test(w.walletType) ? 'cash' : /e-?wallet|digital/i.test(w.walletType) ? 'ewallet' : 'bank', initial:0, _bal:Number(w.balance) || 0}));

  st.wallets.forEach(w => { const tmp = {...w, initial:0}; w.initial = w._bal - walletBalanceIn(tmp, st.tx); delete w._bal; });

  st.debts = (d.debts || []).map(x => ({id:x.id || uid(), person:x.name || x.personName || x.person || 'Seseorang', amount:Math.abs(Number(x.amount ?? x.remaining) || 0),

function importSheet() {
  let pending = null;
  sheet(`<h3>Pulihkan data</h3><p class="muted" style="margin:0">Pilih file cadangan Dompetku atau Money Manager (.json), atau tempel isinya. Data yang ada sekarang akan diganti.</p>
    <label class="btn sec" style="display:block;text-align:center;margin-top:14px">Pilih file cadangan<input id="im-file" type="file" accept=".json,application/json" hidden></label>
    <textarea id="im" class="inp" rows="5" style="margin-top:12px" placeholder="atau tempel isi JSON di sini"></textarea>
    <div id="im-prev"></div><button class="btn" id="im-go">Periksa</button>`, root => {
    const prev = root.querySelector('#im-prev'), go = root.querySelector('#im-go');
    const check = text => {
      try {
        const d = JSON.parse(text); let st, src;
        if (isMoneyManager(d)) { st = fromMoneyManager(d); src = 'Money Manager'; }
        else if (Array.isArray(d.tx) && Array.isArray(d.wallets)) { st = Object.assign(fresh(), d); src = 'Dompetku'; }
        else throw 0;
        pending = st;
        const bal = st.wallets.reduce((a, w) => a + walletBalanceIn(w, st.tx), 0);
        prev.innerHTML = `<div class="card"><b>Cadangan ${src}</b><div class="muted" style="font-size:13.5px;margin:4px 0 8px">${st.wallets.length} dompet · ${st.tx.length} transaksi · ${st.assets.length} aset · ${st.debts.length} utang-piutang</div>
          ${st.wallets.map(w => `<div style="display:flex;justify-content:space-between;font-size:14px;padding:3px 0"><span>${WTYPES[w.type].emoji} ${esc(w.name)}</span><b class="num">${rp(walletBalanceIn(w, st.tx))}</b></div>`).join('')}
          <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span>Total</span><b class="num">${rp(bal)}</b></div></div>`;
        go.textContent = 'Ganti data dengan cadangan ini';
      } catch { pending = null; prev.innerHTML = ''; go.textContent = 'Periksa'; toast('Isi cadangan tidak valid'); }
    };
    root.querySelector('#im-file').onchange = async e => { const f = e.target.files[0]; if (f) { const txt = await f.text(); root.querySelector('#im').value = ''; check(txt); } };
    go.onclick = () => {
      if (!pending) { check(root.querySelector('#im').value); return; }
      S = pending; ui.wallet = 'all'; persist(true); closeSheet(); render(); toast('Data dipulihkan');
    };
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act;
  if (a === 'go') { ui.tab = b.dataset.tab; if (b.dataset.acct) ui.acct = b.dataset.acct; render(); scrollTo(0,0); }
  else if (a === 'month') { ui.month = shiftYm(ui.month, +b.dataset.k); render(); }
  else if (a === 'setmonth') { ui.month = b.dataset.m; render(); }
  else if (a === 'pickmonth') monthSheet();
  else if (a === 'hide') { S.settings.hide = !S.settings.hide; persist(); render(); if ($('#layer .sheet')) closeSheet(); }
  else if (a === 'togglesearch') { ui.showSearch = !ui.showSearch; if (!ui.showSearch) ui.query = ''; render(); const q = $('#q'); q && q.focus(); }
  else if (a === 'add') txSheet(null, b.dataset.type);
  else if (a === 'edittx') txSheet(S.tx.find(t => t.id === b.dataset.id));
  else if (a === 'acct') { ui.acct = b.dataset.k; render(); }
  else if (a === 'ov') { ui.ovMode = b.dataset.m; render(); }
  else if (a === 'addwallet') walletSheet();
  else if (a === 'editwallet') walletSheet(wal(b.dataset.id));
  else if (a === 'editasset') assetSheet(S.assets.find(x => x.id === b.dataset.id));
  else if (a === 'editdebt') debtSheet(S.debts.find(x => x.id === b.dataset.id));
  else if (a === 'payday') paydaySheet();
  else if (a === 'later') { S.settings[b.dataset.k] = b.dataset.k === 'backupLater' ? today() : true; persist(); render(); }
  else if (a === 'trend') { ui.trendBars = b.dataset.k === '1'; render(); }
  else if (a === 'range') { ui.range = b.dataset.k; render(); }
  else if (a === 'wgroup') { ui.wgroup = ui.wgroup === false; render(); }
  else if (a === 'wview') { ui.wview = b.dataset.k; render(); }
  else if (a === 'acctmenu') acctMenu();
  else if (a === 'addasset') assetSheet();
  else if (a === 'adddebt') debtSheet();
  else if (a === 'path') pathSheet();
  else if (a === 'install') installSheet();
  else if (a === 'noinstall') { S.settings.installDismissed = true; persist(); render(); }
  else if (a === 'budgets') budgetSheet();
  else if (a === 'goals') goalsSheet();
  else if (a === 'addgoal') goalSheet(null, !!$('#goals-sheet'));
  else if (a === 'editgoal') goalSheet(S.goals.find(x => x.id === b.dataset.id), !!$('#goals-sheet'));
  else if (a === 'depgoal') goalDepositSheet(S.goals.find(x => x.id === b.dataset.id), !!$('#goals-sheet'));
  else if (a === 'cats') categoriesSheet();
  else if (a === 'bills') billsSheet();
  else if (a === 'addbill') billSheet();
  else if (a === 'editbill') billSheet(S.bills.find(x => x.id === b.dataset.id));
  else if (a === 'paybill') {
    const bl = S.bills.find(x => x.id === b.dataset.id);
    if (bl) {
      if (!wal(bl.walletId)) bl.walletId = S.wallets[0].id;
      S.tx.push({id:uid(), type:'expense', amount:bl.amount, walletId:bl.walletId, categoryId:bl.categoryId, date:today(), note:bl.name, billId:bl.id, created:Date.now()});
      persist(); render(); if ($('#bills-sheet')) billsSheet(); toast(`${bl.name} dibayar`);
    }
  }
  else if (a === 'theme') { const k = b.dataset.k; if (k === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k; try { localStorage.setItem(KEY+'-theme', k); } catch {} render(); }
  else if (a === 'export') exportData();
  else if (a === 'import') importSheet();
  else if (a === 'erase') { if (confirm('Hapus semua transaksi, dompet, aset, dan utang? Tindakan ini tidak bisa dibatalkan.')) { S = fresh(); persist(); render(); toast('Semua data dihapus'); } }
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'wallet') { ui.wallet = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#fab').onclick = () => {
  if (ui.tab === 'acct' && ui.acct === 'wallet') walletSheet();
  else if (ui.tab === 'acct' && ui.acct === 'asset') assetSheet();
  else if (ui.tab === 'acct' && ui.acct === 'debt') debtSheet();
  else txSheet(null, 'expense');
};
try { const th = localStorage.getItem(KEY+'-theme'); if (th && th !== 'auto') document.documentElement.dataset.theme = th; } catch {}
if (!Array.isArray(S.bills)) S.bills = [];
if (!S.budgets || typeof S.budgets !== 'object') S.budgets = {};
if (!Array.isArray(S.goals)) S.goals = [];
{ const boot = $('#boot'); if (isStandalone() && boot) { boot.hidden = false; requestAnimationFrame(() => setTimeout(() => { boot.classList.add('out'); setTimeout(() => boot.remove(), 400); }, 350)); } else if (boot) boot.remove(); }
autoBills();
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru siap. Tutup dan buka lagi Dompetku.'); });
    });
  }).catch(() => {});
}
})();
</script>
</body>
</html>
